<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | CarMarket</title><link rel="stylesheet" href="/static/css/style.css"></head><body class="admin-body"><aside class="sidebar"><a class="brand" href="/">CAR<span>MARKET</span></a><div class="admin-user"><div class="avatar">A</div><div><strong>Administrator</strong><small>Control Center</small></div></div><nav><button class="side active" data-view="dashboard">▦ Dashboard</button><button class="side" data-view="inventory">▤ Inventory</button><button class="side" data-view="messages">◉ Live Messages <b id="msgBadge"></b></button><button class="side" data-view="customers">♙ Customers</button></nav><button class="side logout" onclick="adminLogout()">↪ Logout</button></aside><main class="admin-main"><header class="admin-head"><div><p class="eyebrow">DEALERSHIP CONTROL CENTER</p><h1 id="viewTitle">Dashboard</h1></div><button class="btn gold" onclick="openCarModal()">＋ Add New Vehicle</button></header><section id="adminContent"></section></main><div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-x" onclick="closeModal()">×</button><h2 id="modalTitle">Add Vehicle</h2><form id="carForm" class="form-grid"><input type="hidden" id="carId"><label>Year<input id="year" type="number" required></label><label>Make<input id="make" required></label><label>Model<input id="model" required></label><label>Category<select id="category"><option>SUVs</option><option>Sedans</option><option>Trucks</option><option>Sports Cars</option><option>Luxury</option><option>Other</option></select></label><label>Price ($)<input id="price" type="number" step="0.01" required></label><label>Mileage<input id="mileage" type="number" required></label><label>Transmission<input id="transmission" value="Automatic" required></label><label>Fuel Type<input id="fuel_type" value="Gasoline" required></label><label class="wide">Upload Photos<input id="photos" type="file" accept="image/*" multiple><small>Upload from your phone/computer. You can select multiple photos.</small></label><label class="wide">Or Image URLs<textarea id="imageUrls" placeholder="One direct image URL per line"></textarea></label><label class="wide">Description<textarea id="description"></textarea></label><label class="check"><input id="featured" type="checkbox"> Featured / Great Deal</label><button class="btn gold wide">Save Vehicle</button><div id="carError" class="error wide"></div></form></div></div><script src="/static/js/app.js"></script><script>initAdmin();</script></body></html>
